<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>토핑케이크 롤링페이퍼</title>
<meta name="description" content="도트 케이크 위에 메시지를 토핑처럼 올리는 온라인 롤링페이퍼">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* 제목: 배달의민족 꾸불림체 / 본문: 나눔스퀘어라운드 */
@font-face{font-family:"KkuBulLim";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/BMkkubulimTTF-Regular.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/yellopencil/yellopencil-webfonts@v1.11.0/fonts/kkubulim/BMKkubulimTTF.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"NanumSquareRound";src:url("fonts/NanumSquareRound.woff") format("woff");font-weight:400 800;font-display:swap}
/* Layout: grid-paper desk → one centered column; the pixel cake is the stage, notes pile up below it */
:root{
  --bg:#fffafb; --grid:#f4e6ec; --ink:#4a3640; --muted:#8f7783; --line:#ecd9e1;
  --panel:#ffffff; --accent:#ff7a9a; --accent-ink:#ffffff; --mint:#6fc3a0; --soft:#fff0f4;
  --note-ink:#4a3640; --danger:#d9485f;
  --f-title:"KkuBulLim","NanumSquareRound","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-display:"NanumSquareRound","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"NanumSquareRound",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"NanumSquareRound","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-pixel:"Silkscreen",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1b27; --grid:#2a2636; --ink:#f6ebf1; --muted:#ab9aa8; --line:#3b3648;
  --panel:#272333; --accent:#ff8fab; --accent-ink:#2a1720; --mint:#7fd3b0; --soft:#33293a; --danger:#ff7b8e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1b27; --grid:#2a2636; --ink:#f6ebf1; --muted:#ab9aa8; --line:#3b3648;
  --panel:#272333; --accent:#ff8fab; --accent-ink:#2a1720; --mint:#7fd3b0; --soft:#33293a; --danger:#ff7b8e; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{
  margin:0;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 60px;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-title);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.25}
.pixel-label{font-family:var(--f-pixel);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
button,input,textarea{font:inherit;color:inherit}
.btn{
  font-family:var(--f-display);font-weight:700;font-size:15px;border:2px solid var(--ink);background:var(--panel);
  padding:8px 16px;border-radius:8px;box-shadow:0 3px 0 var(--ink);cursor:pointer;
  transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.tile:focus-visible,.pick:focus-visible,.swatch:focus-visible,.flavor:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{font-size:14px;padding:5px 11px}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:18px;box-shadow:4px 4px 0 var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-display);font-weight:700;font-size:14px}
.field input,.field textarea{
  border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 12px;outline:none;width:100%
}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{font-family:var(--f-hand);font-size:16px;line-height:1.6;resize:vertical;min-height:110px}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;border:1.5px dashed var(--line);border-radius:999px;padding:3px 10px;background:transparent;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.banner{border:2px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);background:var(--panel)}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hero-text{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;max-width:34em}
.hero h1{font-size:clamp(30px,6vw,44px)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted)}
.hero-board{max-width:560px}
.how{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.how li{display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px}
.how b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px}
.share.owner{border-color:var(--accent);box-shadow:4px 4px 0 var(--soft)}
.create{display:flex;flex-direction:column;gap:14px}
.flavors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:480px){.flavors{grid-template-columns:repeat(2,1fr)}}
.flavor{border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.flavor img{width:100%;max-width:110px;image-rendering:pixelated}
.flavor[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.tile:hover{transform:translateY(-2px)}
.tile img{width:100%;image-rendering:pixelated;aspect-ratio:4/3}
.tile b{font-family:var(--f-title);font-weight:400;font-size:20px}
.tile span{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 10px;border:2px dashed var(--line);border-radius:12px}
.findrow{display:flex;gap:8px}
.findrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:7px 10px;font-family:var(--f-pixel);letter-spacing:.1em}

/* ---------- cake view ---------- */
.topbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.cake-head{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.cake-head h1{font-size:clamp(28px,6vw,42px)}
.cake-head .sub{font-family:var(--f-title);font-size:24px;color:var(--muted)}
.board{display:flex;flex-direction:column;align-items:center;width:100%;padding-top:6px}
.topper{display:block;image-rendering:pixelated;max-width:60%;margin-bottom:-2px;position:relative;z-index:2}
.tier{display:flex;justify-content:center;align-items:flex-start;gap:10px;padding:34px 18px 0;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;max-width:100%;margin-top:-4px;position:relative}
.plate{background-size:100% 100%;image-rendering:pixelated;margin-top:-4px;max-width:100%}
.board-tools{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.board-tools .hint{flex:1;min-width:0}
.orn{width:var(--cw,110px);height:var(--ch,140px);perspective:800px;cursor:pointer;flex:none;position:relative;transform:rotate(var(--rot,0deg));transition:transform .15s}
.orn:hover{transform:rotate(0deg) translateY(-3px)}
.orn:focus-visible{outline:3px solid var(--mint);outline-offset:4px;border-radius:12px}
.orn-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.34,1.35,.5,1);transform-style:preserve-3d}
.orn.flipped .orn-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--n-bg);color:var(--note-ink);border:2px solid #4a3640;border-radius:10px;box-shadow:3px 3px 0 rgba(74,54,64,.3);display:flex;flex-direction:column}
.front{align-items:center;justify-content:center;padding:8px;background:transparent!important;border:0!important;box-shadow:none!important}
.front::after{content:"";position:absolute;left:24%;right:24%;bottom:16%;height:9%;border-radius:50%;background:rgba(74,54,64,.16);z-index:-1}
.orn:not(.flipped):not(.add):not(.wc):hover .front img{transform:translateY(-4px)}
.front img{height:62%;width:auto;max-width:92%;image-rendering:pixelated;transition:transform .2s;position:relative}
.front .from{font-family:var(--f-pixel);font-size:9px;letter-spacing:.12em;opacity:.55;margin-top:6px}
.front b{font-family:var(--f-display);font-weight:800;font-size:14px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hook{position:absolute;top:-8px;left:50%;width:13px;height:13px;border:2px solid #4a3640;border-radius:50%;background:#fff;transform:translateX(-50%)}
.back{transform:rotateY(180deg);padding:9px 9px 6px;justify-content:space-between;gap:4px}
.back .msg{font-family:var(--f-hand);line-height:1.45;letter-spacing:-.01em;white-space:pre-wrap;word-break:break-word;overflow:auto;flex:1;min-height:0}
.back .sig{display:flex;justify-content:space-between;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:11px}
.back .sig span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.75}
.orn-del{border:0;background:none;color:#a33c55;cursor:pointer;font-size:11px;padding:0 2px;flex:none;font-family:var(--f-body)}
.orn.add{border:2px dashed rgba(74,54,64,.55);border-radius:10px;background:rgba(255,255,255,.6);color:#4a3640;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-display);font-size:14px;perspective:none}
.orn.add .plus{font-size:28px;line-height:1}
.orn.add:disabled{opacity:.5;cursor:default}
.wc-sheet{gap:12px}
.wc-stepper{display:flex;justify-content:center;gap:6px;font-size:13px;font-weight:700}
.wc-stepper span{padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.wc-stepper span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wc-stage{display:flex;justify-content:center;padding:12px 0 4px}
.orn.wc{--cw:min(210px,62vw);--ch:min(270px,80vw);cursor:default}
.orn.wc:hover{transform:none}
.wc .front{gap:4px;padding:18px 10px 14px}
.wc-art{height:60%!important;max-width:90%}
.wc-empty{height:60%;width:80%;background:rgba(255,255,255,.6);border:2px dashed rgba(74,54,64,.45);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#7a6470;text-align:center;padding:6px}
.wc-empty .plus{font-size:30px;line-height:1;font-family:var(--f-title)}
.wc .front .from{font-size:11px}
.wc-name{font-size:18px!important}
.wc .back{padding:14px 12px 10px}
.wc-text{flex:1;min-height:0;width:100%;border:0;background:transparent;resize:none;outline:none;color:var(--note-ink);font-family:var(--f-hand);font-size:15px;line-height:1.55;padding:0;
  background-image:linear-gradient(transparent calc(1.55em - 1px),rgba(74,54,64,.14) 1px);background-size:100% 1.55em;background-attachment:local}
.wc-text::placeholder{color:rgba(74,54,64,.45)}
.wc-count{font-weight:400;opacity:.6;font-size:11px}
.wc-step{display:flex;flex-direction:column;gap:12px}
.wc-step[hidden]{display:none!important}
.wc-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.wc-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg)}60%{transform:scale(1.08) rotate(2deg)}100%{transform:rotate(var(--rot,0deg))}}
.orn.pop{animation:pop .6s ease-out}
@media (prefers-reduced-motion:reduce){.orn-inner{transition:none}}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.share{display:flex;flex-direction:column;gap:10px}
.share .linkbox{display:flex;gap:8px}
.share input{flex:1;min-width:0;border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;font-size:13px}
.code{font-family:var(--f-pixel);font-size:18px;letter-spacing:.15em;color:var(--accent)}
.count{font-family:var(--f-title);font-size:22px}
.danger-zone{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}

/* ---------- compose modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(40,25,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:620px){.overlay{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.pick{border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 2px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:1px}
.pick img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.swatches{display:flex;gap:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #4a3640;cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#print-root{display:none}
@page{size:257mm 364mm;margin:0}
@media print{
  html,body{padding:0!important;margin:0!important;background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root img{display:block;width:257mm;height:364mm;max-width:none;break-after:page;page-break-after:always}
  #print-root img:last-child{break-after:auto;page-break-after:auto}
}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== config ===================== */
const W = 160, H = 120;

/* ===================== pixel sprites ===================== */
const PAL = {
  r:"#ff5d73", R:"#c8344f", w:"#ffffff", g:"#7ccf6e", G:"#3e8f4a", y:"#ffd84d", O:"#d98a1f", o:"#ff9a3c",
  k:"#4a3a3a", p:"#ffb3c8", P:"#d9668a", b:"#7d8ef0", B:"#3f4bb0", m:"#a8e6cf", M:"#4fa585",
  S:"#d6c3ca", s:"#fff1dd", n:"#e8b37a", N:"#a8693a", c:"#8a5a40", C:"#4a2a1c", a:"#ffb35c", A:"#d9762a"
};
const SPRITES = [
  {id:"strawberry",ko:"딸기",rows:["...gGg...","..gGgGg..",".RrrrrrR.","RrwrrrwrR","RrrrwrrrR",".RrrrrwR.",".RrwrrrR.","..RrrrR..","...RRR..."]},
  {id:"cherry",ko:"체리",rows:[".....GG..","....G.G..","...G...G.","..G....G.",".RR...RR.","RwrR.RwrR","RrrR.RrrR",".RR...RR."]},
  {id:"candle",ko:"초",rows:["..y..",".yoy.",".yoy.","..k..",".PwP.",".PpP.",".PwP.",".PpP.",".PwP."]},
  {id:"heart",ko:"하트",rows:[".PP.PP.","PppPppP","PwppppP","PpppppP",".PpppP.","..PpP..","...P..."]},
  {id:"star",ko:"별",rows:["....O....","...OyO...","OOOOyOOOO","OyywyyyyO",".OyyyyyO.","..OyyyO..",".OyyOyyO.",".OyO.OyO.",".OO...OO."]},
  {id:"macaron",ko:"마카롱",rows:[".MMMMMM.","MmwmmmmM","MmmmmmmM","SssssssS","MmmmmmmM",".MMMMMM."]},
  {id:"cookie",ko:"쿠키",rows:["..NNNN..",".NnnCnN.","NnCnnnnN","NnnnnCnN","NnnCnnnN",".NnnnCN.","..NNNN.."]},
  {id:"blueberry",ko:"블루베리",rows:["..BBB.....",".BbwbB.BB.",".BbbbBBbbB","..BBBBwbbB",".BBB.BbbB.","BwbbB.BB..","BbbbB.....",".BBB......"]},
  {id:"cream",ko:"생크림",rows:["....S....","...SwS...","..SwwwS..","..SSSSS..",".SwwwwwS.",".SSSSSSS.","SwwwwwwwS","SSSSSSSSS"]},
  {id:"flower",ko:"꽃",rows:["..PP.PP..",".PppPppP.",".PppPppP.","..PPyPP..",".PppyppP.",".PppPppP.","..PP.PP.."]},
  {id:"choco",ko:"초콜릿",rows:["CCCCCCC","CccCccC","CwcCccC","CCCCCCC","CccCccC","CccCccC","CCCCCCC"]},
  {id:"gummy",ko:"곰젤리",rows:[".A...A.","AaA.AaA",".AaaaA.","AawaawA",".AaaaA.","AaaaaaA","AaaaaaA",".A...A."]}
];
const hex = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
SPRITES.forEach(s=>{
  s.h = s.rows.length; s.w = Math.max(...s.rows.map(r=>r.length)); s.px=[];
  s.rows.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(PAL[ch]) s.px.push([x,y,hex(PAL[ch])]); }));
});
const SPR = Object.fromEntries(SPRITES.map(s=>[s.id,s]));

const NOTES = [
  {id:"cream",ko:"크림",c:"#fff3d6"},{id:"berry",ko:"딸기우유",c:"#ffdfe7"},{id:"mint",ko:"민트",c:"#d8f2e5"},
  {id:"sky",ko:"소다",c:"#d9ecfd"},{id:"lav",ko:"라벤더",c:"#e9e1ff"}
];
const noteColor = id => (NOTES.find(n=>n.id===id)||NOTES[0]).c;

const FLAVORS = {
  strawberry:{ko:"딸기 생크림",top:"#ffe6ec",topHi:"#fff6f8",topLo:"#ffd2dd",side:"#ffc4d2",sideLo:"#f29db4",sideHi:"#ffd9e2",band:"#fff7f9",bandLo:"#e88aa4",line:"#a94f6c"},
  choco:{ko:"초코 가나슈",top:"#8f5c45",topHi:"#ab775d",topLo:"#7a4b37",side:"#704535",sideLo:"#583427",sideHi:"#875744",band:"#f6e4cc",bandLo:"#4a2a1c",line:"#331c14"},
  matcha:{ko:"말차 크림",top:"#ddefc9",topHi:"#eef7e2",topLo:"#c9e3ae",side:"#b6d99a",sideLo:"#93be76",sideHi:"#c9e5b2",band:"#fffaf0",bandLo:"#7fa964",line:"#557d3d"},
  lavender:{ko:"블루베리 라벤더",top:"#e9e3ff",topHi:"#f6f3ff",topLo:"#d8cff9",side:"#cbc0f5",sideLo:"#a99de0",sideHi:"#dad2fb",band:"#fffaff",bandLo:"#8e81cf",line:"#62559f"}
};

/* ===================== cake drawing ===================== */
const baseCache = {};
function buildBase(flavorId){
  if(baseCache[flavorId]) return baseCache[flavorId];
  const F = FLAVORS[flavorId]||FLAVORS.strawberry;
  const buf = new Uint8ClampedArray(W*H*4), mask = new Uint8Array(W*H);
  const put=(x,y,c)=>{ if(x<0||y<0||x>=W||y>=H) return; const i=(y*W+x)*4; buf[i]=c[0];buf[i+1]=c[1];buf[i+2]=c[2];buf[i+3]=255; };
  const outline=(m,c)=>{ for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(m[y*W+x])continue;
      if((x>0&&m[y*W+x-1])||(x<W-1&&m[y*W+x+1])||(y>0&&m[(y-1)*W+x])||(y<H-1&&m[(y+1)*W+x])) put(x,y,c);} };
  // plate
  const plate = new Uint8Array(W*H);
  for(let y=80;y<H;y++)for(let x=0;x<W;x++){ const dx=x-80,dy=y-100, n=(dx/74)**2+(dy/14)**2;
    if(n<=1){ plate[y*W+x]=1; put(x,y,hex(n>0.7&&dy>1?"#dbe3ee":(n>0.55&&dy<=1?"#f4f7fb":"#ffffff"))); } }
  outline(plate,hex("#8e9cb0"));
  // cake body
  const C = new Uint8Array(W*H), cv=k=>hex(F[k]);
  for(let x=20;x<=140;x++){ const dx=x-80, c=Math.sqrt(Math.max(0,1-(dx/60.5)**2));
    const bottom=Math.round(92+10*c), b1=Math.round(68+10*c), b2=Math.round(71+10*c);
    for(let y=48;y<=bottom;y++){ let col="side";
      if(y>=b1&&y<=b2) col="band"; else if(y===b2+1) col="bandLo";
      else if(dx<-53) col="sideHi"; else if(dx>46||y===bottom) col="sideLo";
      put(x,y,cv(col)); C[y*W+x]=1; } }
  // top
  for(let y=30;y<=66;y++)for(let x=18;x<=142;x++){ const dx=x-80,dy=y-48,n=(dx/60.5)**2+(dy/15)**2;
    if(n<=1){ let col="top"; if(n>0.6&&n<0.8&&dy<0) col="topHi"; else if(n>0.82&&dy>0) col="topLo"; put(x,y,cv(col)); C[y*W+x]=1; } }
  // drips
  const L=[2,5,3,7,2,4,6,3,8,2,5,3,6,2,4,7,3,5,2,6,4,3,7,2,5,3,4,6,2,5,3];
  for(let x=21;x<=139;x++){ const dx=x-80,c=Math.sqrt(Math.max(0,1-(dx/60.5)**2)), g=Math.floor((x-21)/4), e=(x-21)%4;
    let len=L[g%L.length]-((e===0||e===3)?1:0); const yE=Math.round(48+15*c);
    for(let y=yE;y<=yE+len;y++){ put(x,y,cv(y===yE+len?"topLo":"top")); C[y*W+x]=1; } }
  outline(C,cv("line"));
  // cream dollops along the rim
  const dol=["..S..",".SwS.","SwwwS","SSSSS"], dolPx=[];
  dol.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(PAL[ch]) dolPx.push([x,y,ch==="S"?hex("#e6d6dc"):hex("#fffdfb")]); }));
  const pts=[]; for(let k=0;k<18;k++){ const t=k/18*Math.PI*2; pts.push([Math.round(80+54*Math.cos(t)),Math.round(48+12.5*Math.sin(t))]); }
  pts.sort((a,b)=>a[1]-b[1]).forEach(([px,py])=>dolPx.forEach(([x,y,c])=>put(px-2+x,py-3+y,c)));
  for(let i=0;i<W*H;i++) mask[i]=C[i];
  return (baseCache[flavorId]={buf,mask});
}
function stamp(buf,s,cx,cy,opts={}){
  const ox=cx-Math.floor(s.w/2), oy=cy-s.h+2, a=opts.alpha??1;
  const blend=(x,y,c,al)=>{ if(x<0||y<0||x>=W||y>=H) return; const i=(y*W+x)*4;
    for(let k=0;k<3;k++) buf[i+k]=buf[i+k]*(1-al)+c[k]*al; buf[i+3]=Math.max(buf[i+3],255*al); };
  if(opts.ring){ const occ=new Set(s.px.map(([x,y])=>x+","+y));
    s.px.forEach(([x,y])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([u,v])=>{ if(!occ.has((x+u)+","+(y+v))) blend(ox+x+u,oy+y+v,opts.ring,1); })); }
  if(!opts.noShadow) s.px.forEach(([x,y])=>blend(ox+x+1,oy+y+1,[60,30,45],.22*a));
  s.px.forEach(([x,y,c])=>blend(ox+x,oy+y,c,a));
}
function spriteBox(t){ const s=SPR[t.sprite]||SPRITES[0]; return {x:t.x-Math.floor(s.w/2)-1,y:t.y-s.h+1,w:s.w+2,h:s.h+2}; }
function paintCake(canvas,flavor,tops,extra={}){
  const base=buildBase(flavor), buf=new Uint8ClampedArray(base.buf);
  const all=[...tops]; if(extra.ghost) all.push({...extra.ghost,_ghost:true});
  all.sort((a,b)=>a.y-b.y).forEach(t=>{ const s=SPR[t.sprite]||SPRITES[0];
    stamp(buf,s,t.x,t.y,{alpha:t._ghost?.6:1, ring:(extra.sel&&t.id===extra.sel)?[255,255,255]:null}); });
  canvas.width=W; canvas.height=H;
  canvas.getContext("2d").putImageData(new ImageData(buf,W,H),0,0);
}
const urlCache={};
function spriteURL(id,scale=4){ const k=id+scale; if(urlCache[k]) return urlCache[k];
  const s=SPR[id], c=document.createElement("canvas"); c.width=s.w*scale; c.height=s.h*scale; const x=c.getContext("2d");
  s.px.forEach(([px,py,col])=>{ x.fillStyle=`rgb(${col})`; x.fillRect(px*scale,py*scale,scale,scale); });
  return (urlCache[k]=c.toDataURL()); }
function cakeURL(flavor){ const k="cake-"+flavor; if(urlCache[k]) return urlCache[k];
  const c=document.createElement("canvas"); paintCake(c,flavor,[]); return (urlCache[k]=c.toDataURL()); }

    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v); }
  kids.flat().forEach(k=>k!=null&&e.append(k)); return e; }

const API_URL = ((window.ROLLING_CONFIG||{}).API_URL||"").trim();
const S = { unsub:[], key:"" };
S.key = lsGet("rpKey") || (()=>{ const k=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(36).padStart(2,"0")).join("").slice(0,28); lsSet("rpKey",k); return k; })();
async function api(action,payload={}){
  if(!API_URL) throw {code:"no_api"};
  let res;
  try{ res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,key:S.key,...payload})}); }
  catch(e){ throw {code:"network"}; }
  let j; try{ j=await res.json(); }catch(e){ throw {code:"bad_response"}; }
  if(!j.ok) throw {code:j.error||"error"};
  return j.data;
}

let loading=false;
async function loadTops(){
  if(loading||!V.cake) return; loading=true;
  try{ const list=await api("listToppings",{cake:V.code});
    const sig=JSON.stringify(list.map(t=>[t.id,t.mine])), changed=sig!==V.sig; V.sig=sig;
    V.tops=list.filter(t=>SPR[t.sprite]).map(t=>({...t,x:+t.x,y:+t.y})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(changed) layoutBoard();
  }catch(e){}
  finally{ loading=false; }
}

const DOT=4;
function tierURL(wd,hd,flavor,seed){
  const F=FLAVORS[flavor]||FLAVORS.strawberry, c=document.createElement("canvas"); c.width=wd; c.height=hd;
  const x=c.getContext("2d"), px=(i,j,col)=>{ x.fillStyle=col; x.fillRect(i,j,1,1); };
  const L=[1,3,2,4,1,2,5,2,3,1,4,2,3,5,1,2,4,3];

      x.font='14px Silkscreen, monospace'; x.globalAlpha=.55; x.fillText("FROM.",cx+PAD+s.w*sc+12,cy+TOP+HEAD/2-12); x.globalAlpha=1;
      x.font=`bold 24px ${FB}`; let nm=t.name||"익명"; const nmW=colW-PAD*2-s.w*sc-12;
      while(nm.length>1&&x.measureText(nm).width>nmW) nm=nm.slice(0,-1); if(nm!==(t.name||"익명")) nm=nm.slice(0,-1)+"…";
      x.fillText(nm,cx+PAD+s.w*sc+12,cy+TOP+HEAD/2+10);
      x.textBaseline="alphabetic"; x.font=`24px ${FB}`;
      lines.forEach((l,li)=>x.fillText(l,cx+PAD,cy+TOP+HEAD+10+LH*(li+1)-10));
    });
    return c; });
}
function saveBlob(blob,name){ const u=URL.createObjectURL(blob), a=el("a",{href:u,download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
async function exportFile(kind){
  if(!V.cake) return;
  V.exportBtns.forEach(b=>b.disabled=true); toast(kind==="print"?"출력할 종이를 준비하는 중이에요":"파일을 만드는 중이에요");
  try{
    const base=`${V.cake.to}_롤링페이퍼`.replace(/[\\/:*?"<>|]/g,"");
    if(kind==="png"){ const [c]=await buildPages(false); const blob=await new Promise(r=>c.toBlob(r,"image/png"));
      saveBlob(blob,base+".png"); toast("저장했어요"); }
    else if(kind==="pdf"){ if(!window.jspdf){ toast("PDF 도구를 불러오지 못했어요. 이미지로 저장해 주세요"); return; }
      const pages=await buildPages(true); const pdf=new window.jspdf.jsPDF({unit:"mm",format:[B4.wMM,B4.hMM]});
      pages.forEach((c,i)=>{ if(i) pdf.addPage([B4.wMM,B4.hMM]); pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,B4.wMM,B4.hMM); });
      saveBlob(pdf.output("blob"),base+"_B4.pdf"); toast("저장했어요"); }
    else {
      const pages=await buildPages(true);
      let root=$("#print-root"); if(root) root.remove();
      root=el("div",{id:"print-root"}); document.body.append(root);
      await Promise.all(pages.map(c=>new Promise(res=>{ const im=new Image(); im.onload=res; im.onerror=res; im.src=c.toDataURL("image/png"); im.alt=""; root.append(im); })));
      setTimeout(()=>{ window.print(); },60);
    }
  }catch(err){ toast("만들지 못했어요. 다시 시도해 주세요"); }
  finally{ V.exportBtns.forEach(b=>b.disabled=false); }
}
window.addEventListener("afterprint",()=>{ const r=$("#print-root"); if(r) r.remove(); });

route();
